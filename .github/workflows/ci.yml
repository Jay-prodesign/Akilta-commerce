name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (main)
        run: pnpm run typecheck

      - name: Typecheck (staging/plain-test project)
        run: pnpm run typecheck:staging

      - name: Lint
        run: pnpm run lint

      - name: Dependency-free contract/security suite
        if: always()
        run: pnpm run test

      - name: Vitest suite
        if: always()
        run: pnpm run test:vitest

      - name: Cloudflare Workers runtime smoke
        if: always()
        run: pnpm run test:worker

      - name: Dependency audit
        if: always()
        run: pnpm audit

      - name: License scan
        if: always()
        run: pnpm licenses list
